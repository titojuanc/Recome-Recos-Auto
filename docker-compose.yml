services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-api:
    image: python:3.12-slim
    command: python /srv/server.py --port 8080 --users 25 --key dev-key
    volumes: ["./docker/mock-api-general/server.py:/srv/server.py:ro"]

  cron:
    build:
      context: .
      dockerfile: docker/cron/Dockerfile
    depends_on:
      rabbitmq: {condition: service_healthy}
      mock-api: {condition: service_started}
    environment:
      API_GENERAL_BASE_URL: http://mock-api:8080/api/v1
      API_GENERAL_API_KEY: dev-key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      RUN_SCHEDULE: ${RUN_SCHEDULE:-0 12 * * *}
      RUN_TIMEZONE: ${RUN_TIMEZONE:-America/Argentina/Buenos_Aires}
    stop_grace_period: 30s

  # Simula a Recome-Notificaciones: es quien declara la cola de salida (el worker no la declara).
  declarar-notificaciones:
    image: rabbitmq:3.13-management
    depends_on:
      rabbitmq: {condition: service_healthy}
    entrypoint: >
      sh -c "rabbitmqadmin -H rabbitmq -u guest -p guest declare queue
      name=notificaciones durable=true arguments='{\"x-queue-type\":\"quorum\"}'"
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    depends_on:
      rabbitmq: {condition: service_healthy}
      mock-api: {condition: service_started}
      declarar-notificaciones: {condition: service_completed_successfully}
    environment:
      API_GENERAL_BASE_URL: http://mock-api:8080/api/v1
      API_GENERAL_API_KEY: dev-key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    stop_grace_period: 30s
