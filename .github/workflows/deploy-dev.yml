name: Build & Deploy (dev)

on:
  push:
    branches: ["dev"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [worker, cron]
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen en minúsculas
        run: echo "IMAGE=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  redeploy:
    needs: build-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: worker
            app_id_secret: DOKPLOY_APPLICATION_ID_WORKER
          - service: cron
            app_id_secret: DOKPLOY_APPLICATION_ID_CRON
    steps:
      - name: Redeploy ${{ matrix.service }} en Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ secrets[matrix.app_id_secret] }}
        run: |
          curl -fsSL -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$APPLICATION_ID\"}"
