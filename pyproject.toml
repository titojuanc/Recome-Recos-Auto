[project]
name = "recos-auto"
version = "0.1.0"
description = "Cron de carga diaria de usuarios para recomendaciones automáticas"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requiere un RabbitMQ real (docker compose -f docker-compose.test.yml up -d)",
    "contenedor: requiere Docker para construir y ejecutar la imagen",
    "lento: prueba de rendimiento",
]
addopts = "-m 'not lento'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
