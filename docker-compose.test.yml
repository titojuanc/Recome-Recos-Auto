# Solo RabbitMQ para los tests de integración.
# No levantar junto con el stack e2e-local (ambos usan 5672/15672).
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: recos-auto-rabbit-test
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
